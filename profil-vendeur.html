/* =========================================================
   COMPRESSION IMAGE
   ========================================================= */

window.handleImageCompress =
function(event, previewId, hiddenInputId) {

  const file =
    event.target.files?.[0];

  if (!file) return;


  if (!file.type.startsWith("image/")) {

    alert(
      "Veuillez sélectionner une image."
    );

    event.target.value = "";

    return;
  }


  const reader =
    new FileReader();


  reader.onload =
  function(e) {

    const img =
      new Image();


    img.onload =
    function() {

      const canvas =
        document.createElement("canvas");


      /*
       * Conservation de ton architecture :
       * image légère de 60 x 60.
       */

      canvas.width = 60;

      canvas.height = 60;


      const ctx =
        canvas.getContext("2d");


      ctx.drawImage(
        img,
        0,
        0,
        60,
        60
      );


      const compressedBase64 =
        canvas.toDataURL(
          "image/jpeg",
          0.85
        );


      const preview =
        getElement(previewId);


      const hidden =
        getElement(hiddenInputId);


      if (preview) {

        preview.src =
          compressedBase64;

        preview.style.display =
          "block";

      }


      if (hidden) {

        hidden.value =
          compressedBase64;

      }

    };


    img.onerror =
    function() {

      alert(
        "Impossible de lire cette image."
      );

    };


    img.src =
      e.target.result;

  };


  reader.readAsDataURL(file);
};


/* =========================================================
   PROTECTION CONTRE LE HTML
   ========================================================= */

function escapeHTML(value) {

  const div =
    document.createElement("div");

  div.textContent =
    String(value ?? "");

  return div.innerHTML;
}


/* =========================================================

   ========================================================= */

  return Number(

}

/* =========================================================
   CHARGER / CRÉER LE PROFIL VENDEUR
   CHEMIN :
   users/{uid}
   ========================================================= */

async function chargerProfilVendeur(uid) {

  if (!uid) return;


  const profilRef =
    ref(
      database,
      "users/" + uid
    );


  const snapshot =
    await get(profilRef);


  /*
   * Si le profil n'existe pas,
   * on le crée automatiquement.
   */

  if (!snapshot.exists()) {

    const nouveauProfil = {

      email:
        auth.currentUser?.email || "",

      role:
        "vendeur",

      nomBoutique:
        "Ma Boutique",

      telephone:
        "",

      dateInscription:
        new Date().toISOString()

    };


    await set(
      profilRef,
      nouveauProfil
    );


    afficherProfilDansInterface(
      nouveauProfil
    );


    return;
  }


  const data =
    snapshot.val() || {};


  afficherProfilDansInterface(
    data
  );
}


/* =========================================================
   AFFICHER PROFIL DANS L'INTERFACE
   ========================================================= */

function afficherProfilDansInterface(data) {

  const nomBoutique =
    data.nomBoutique ||
    data.nom ||
    "Ma Boutique";


  /* -----------------------------------------------------
     NOM BOUTIQUE
     ----------------------------------------------------- */

  const headerBoutiqueName =
    getElement(
      "headerBoutiqueName"
    );


  const profBoutique =
    getElement(
      "profBoutique"
    );


  if (headerBoutiqueName) {

    headerBoutiqueName.innerText =
      nomBoutique;

  }


  if (profBoutique) {

    profBoutique.value =
      nomBoutique;

  }


  /* -----------------------------------------------------
     TÉLÉPHONE
     ----------------------------------------------------- */

  const profPhone =
    getElement("profPhone");


  if (profPhone) {

    profPhone.value =
      data.telephone ||
      data.phone ||
      "";

  }


  /* -----------------------------------------------------
     EMAIL
     ----------------------------------------------------- */

  const profEmail =
    getElement("profEmail");


  if (profEmail) {

    profEmail.value =
      data.email ||
      auth.currentUser?.email ||
      "";

  }


  /* -----------------------------------------------------
     PHOTO VENDEUR
     ----------------------------------------------------- */

  const avatar =
    getElement(
      "vendeurAvatar"
    );


  if (!avatar) return;


  if (data.photo60) {

    avatar.innerHTML = "";

    const img =
      document.createElement(
        "img"
      );


    img.src =
      data.photo60;

    img.alt =
      "Photo vendeur";


    img.style.width =
      "100%";

    img.style.height =
      "100%";

    img.style.objectFit =
      "cover";


    avatar.appendChild(img);


  } else {

    avatar.innerText =
      nomBoutique
        .charAt(0)
        .toUpperCase();

  }
}

/* =========================================================
   PUBLICATION D'UN PRODUIT
   CHEMIN :
   produits/{id}
   ========================================================= */

window.publierElement =
async function(e) {

  e.preventDefault();


  if (!currentVendeurUid) {

    alert(
      "Votre session a expiré. Veuillez vous reconnecter."
    );

    return;
  }


  /* -----------------------------------------------------
     RÉCUPÉRATION DES CHAMPS
     ----------------------------------------------------- */

  const type =
    getElement("pType")?.value ||
    "produit";


  const nom =
    getElement("pNom")?.value.trim();


  const auteur =
    getElement("pAuteur")?.value.trim();


  const description =
    getElement("pDescription")?.value.trim();


  const prixNormal =
    Number(
      getElement("pPrixNormal")?.value ||
      0
    );


  const prixPromoInput =
    Number(
      getElement("pPrixPromo")?.value ||
      0
    );


  const stock =
    Number(
      getElement("pStock")?.value ||
      0
    );


  const lienExterne =
    getElement("pLienExterne")?.value.trim() ||
    "";


  const photoBase64 =
    getElement(
      "base64Publish"
    )?.value;


  /* -----------------------------------------------------
     VALIDATION
     ----------------------------------------------------- */

  if (!nom) {

    alert(
      "Veuillez renseigner le nom du produit."
    );

    return;
  }


  if (!prixNormal || prixNormal < 0) {

    alert(
      "Veuillez renseigner un prix normal valide."
    );

    return;
  }


  if (!photoBase64) {

    alert(
      "Veuillez sélectionner une image."
    );

    return;
  }


  if (
    type === "lien" &&
    !lienExterne
  ) {

    alert(
      "Veuillez renseigner le lien externe."
    );

    return;
  }


  /*
   * Si aucun prix promo n'est fourni,
   * le prix normal est utilisé.
   */

  const prixPromo =
    prixPromoInput > 0
      ? prixPromoInput
      : prixNormal;


  try {

    /* ---------------------------------------------------
       NOUVEL ID PRODUIT
       --------------------------------------------------- */

    const newRef =
      push(
        ref(
          database,
          "produits"
        )
      );


    const idProd =
      newRef.key;


    /* ---------------------------------------------------
       DONNÉES PRODUIT

       IMPORTANT :
       imageUrl ET imageUrl60
       sont enregistrés pour être
       compatibles avec l'index.
       --------------------------------------------------- */

    const itemData = {

      id:
        idProd,

      vendeurUid:
        currentVendeurUid,

      type:
        type,

      /*
       * L'index utilise categorie.
       * On enregistre donc les deux.
       */

      categorie:
        type,

      nom:
        nom,

      auteur:
        auteur || "",

      description:
        description || "",

      prixNormal:
        prixNormal,

      prixPromo:
        prixPromo,

      stock:
        stock,

      lienExterne:
        lienExterne,

      /*
       * Compatibilité index.html
       */

      imageUrl:
        photoBase64,

      /*
       * Compatibilité profil vendeur
       */

      imageUrl60:
        photoBase64,

      datePublication:
        new Date().toISOString(),

      statut:
        "actif"

    };


    /* ---------------------------------------------------
       ENREGISTREMENT FIREBASE
       --------------------------------------------------- */

    await set(
      newRef,
      itemData
    );


    /* ---------------------------------------------------
       SUCCÈS
       --------------------------------------------------- */

    alert(
      "Produit publié avec succès !"
    );


    /* ---------------------------------------------------
       RÉINITIALISER FORMULAIRE
       --------------------------------------------------- */

    if (e.target) {

      e.target.reset();

    }


    const preview =
      getElement(
        "previewPublish"
      );


    if (preview) {

      preview.style.display =
        "none";

      preview.removeAttribute(
        "src"
      );

    }


    const hidden =
      getElement(
        "base64Publish"
      );


    if (hidden) {

      hidden.value =
        "";

    }


    /* ---------------------------------------------------
       ACTUALISER LES DONNÉES
       --------------------------------------------------- */

    await chargerMesProduits(
      currentVendeurUid
    );


    await chargerAffiliationGlobal(
      currentVendeurUid
    );


  } catch (error) {

    console.error(
      "Erreur publication produit :",
      error
    );


    alert(
      "Impossible de publier le produit : " +
      error.message
    );

  }

};


/* =========================================================
   CHARGER MES PRODUITS
   CHEMIN :
   produits
   ========================================================= */

async function chargerMesProduits(uid) {

  const tbody =
    getElement(
      "boutiqueProductsList"
    );


  if (!tbody) return;


  tbody.innerHTML = "";


  const snapshot =
    await get(
      ref(
        database,
        "produits"
      )
    );


  let count = 0;

  listeMesProduits = [];


  if (snapshot.exists()) {

    snapshot.forEach(
      (child) => {

        const prod =
          child.val() || {};


        if (
          prod.vendeurUid === uid
        ) {

          count++;


          listeMesProduits.push({
            id: child.key,
            ...prod
          });


          const link =
            window.location.origin +
            "/produit.html?id=" +
            encodeURIComponent(
              child.key
            ) +
            "&aff=" +
            encodeURIComponent(
              uid
            );


          const tr =
            document.createElement(
              "tr"
            );


          tr.innerHTML = `

            <td>

              <img
                src="${escapeHTML(
                  prod.imageUrl ||
                  prod.imageUrl60 ||
                  ""
                )}"
                width="60"
                height="60"
                style="
                  border-radius:6px;
                  object-fit:cover;
                "
                alt="Produit"
              >

            </td>


            <td>

              <strong>
                ${escapeHTML(
                  prod.nom || ""
                )}
              </strong>

              <br>

              <small style="color:var(--text-muted);">
                ${escapeHTML(
                  (
                    prod.categorie ||
                    prod.type ||
                    ""
                  ).toUpperCase()
                )}
              </small>

            </td>


            <td>

              ${escapeHTML(
                prod.auteur ||
                "Non précisé"
              )}

            </td>


            <td>

              <span class="price-promo">

                ${formatPrix(
                  prod.prixPromo
                )}

                FCFA

              </span>


              ${
                Number(
                  prod.prixNormal || 0
                ) >
                Number(
                  prod.prixPromo || 0
                )

                ?

                `
                <span class="price-old">

                  ${formatPrix(
                    prod.prixNormal
                  )}

                  FCFA

                </span>
                `

                :

                ""
              }

            </td>


            <td>

              ${Number(
                prod.stock || 0
              )}

            </td>


            <td>

              <button
                class="btn-copy"
                data-link="${escapeHTML(link)}"
                onclick="window.copierLien(this.dataset.link)"
              >

                <i class="fa-solid fa-copy"></i>

                Copier Lien

              </button>

            </td>

          `;


          tbody.appendChild(
            tr
          );

        }

      }
    );

  }


  /* -----------------------------------------------------
     STATISTIQUE PRODUITS
     ----------------------------------------------------- */

  const statProduits =
    getElement(
      "statProduits"
    );


  if (statProduits) {

    statProduits.innerText =
      count;

  }


  /* -----------------------------------------------------
     AUCUN PRODUIT
     ----------------------------------------------------- */

  if (count === 0) {

    tbody.innerHTML = `

      <tr>

        <td
          colspan="6"
          style="text-align:center;"
        >

          Aucun élément publié.

        </td>

      </tr>

    `;

  }

}


/* =========================================================
   AFFILIATION
   TOUS LES PRODUITS
   ========================================================= */

async function chargerAffiliationGlobal(uid) {

  if (!uid) return;


  const tbody =
    getElement(
      "affiliationProductsList"
    );


  if (!tbody) return;


  tbody.innerHTML = "";


  const snapshot =
    await get(
      ref(
        database,
        "produits"
      )
    );


  if (!snapshot.exists()) {

    tbody.innerHTML = `

      <tr>

        <td
          colspan="5"
          style="text-align:center;"
        >

          Aucun produit disponible.

        </td>

      </tr>

    `;

    return;
  }


  snapshot.forEach(
    (child) => {

      const prod =
        child.val() || {};


      /*
       * Produits actifs seulement
       */

      if (
        prod.statut &&
        prod.statut !== "actif"
      ) {

        return;

      }


      const prix =
        Number(
          prod.prixPromo ||
          prod.prixNormal ||
          0
        );


      /*
       * Commission actuelle :
       * 10 %
       */

      const gainsEstimes =
        Math.round(
          prix * 0.10
        );


      const affLink =
        window.location.origin +
        "/produit.html?id=" +
        encodeURIComponent(
          child.key
        ) +
        "&aff=" +
        encodeURIComponent(
          uid
        );


      const tr =
        document.createElement(
          "tr"
        );


      tr.innerHTML = `

        <td>

          <img
            src="${escapeHTML(
              prod.imageUrl ||
              prod.imageUrl60 ||
              ""
            )}"
            width="60"
            height="60"
            style="
              border-radius:6px;
              object-fit:cover;
            "
            alt="Produit"
          >

        </td>


        <td>

          <strong>

            ${escapeHTML(
              prod.nom || ""
            )}

          </strong>

        </td>


        <td>

          ${formatPrix(
            prix
          )}

          FCFA

        </td>


        <td>

          <strong
            style="color:var(--success-color);"
          >

            +${formatPrix(
              gainsEstimes
            )}

            FCFA

          </strong>

        </td>


        <td>

          <button
            class="btn-copy"
            data-link="${escapeHTML(affLink)}"
            onclick="window.copierLien(this.dataset.link)"
          >

            <i class="fa-solid fa-link"></i>

            Copier Lien Affilié

          </button>

        </td>

      `;


      tbody.appendChild(
        tr
      );

    }
  );

}


/* =========================================================
   COPIER UN LIEN
   ========================================================= */

window.copierLien =
async function(lien) {

  if (!lien) {

    alert(
      "Lien invalide."
    );

    return;
  }


  try {

    await navigator.clipboard.writeText(
      lien
    );


    alert(
      "Lien copié dans le presse-papier !"
    );


  } catch (error) {

    console.error(
      "Erreur copie :",
      error
    );


    /*
     * Méthode de secours
     */

    try {

      const textarea =
        document.createElement(
          "textarea"
        );


      textarea.value =
        lien;


      textarea.style.position =
        "fixed";

      textarea.style.opacity =
        "0";


      document.body.appendChild(
        textarea
      );


      textarea.select();

      document.execCommand(
        "copy"
      );


      textarea.remove();


      alert(
        "Lien copié !"
      );


    } catch {

      alert(
        "Impossible de copier automatiquement le lien."
      );

    }

  }

};


/* =========================================================
   STATISTIQUES VENDEUR
   vendeurs_stats/{uid}
   ========================================================= */

function chargerStats(uid) {

  if (!uid) return;


  const statsRef =
    ref(
      database,
      "vendeurs_stats/" + uid
    );


  onValue(
    statsRef,
    (snapshot) => {

      const data =
        snapshot.exists()
          ? snapshot.val()
          : {};


      const solde =
        Number(
          data.solde || 0
        );


      const gains =
        Number(
          data.gainsAffiliation || 0
        );


      const ventes =
        Number(
          data.ventesTotales || 0
        );


      const visiteurs =

window.demanderRetrait =
async function(e) {

  e.preventDefault();


  if (!currentVendeurUid) {

    alert(
      "Vous devez être connecté."
    );

    return;
  }


  const montant =
    Number(
      getElement(
        "rMontant"
      )?.value ||
      0
    );


  const moyen =
    getElement(
      "rMoyen"
    )?.value ||
    "";


  const numero =
    getElement(
      "rNumero"
    )?.value.trim() ||
    "";


  if (
    !montant ||
    montant < 1000
  ) {

    alert(
      "Le montant minimum est de 1 000 FCFA."
    );

    return;
  }


  if (!moyen) {

    alert(
      "Veuillez sélectionner un moyen de paiement."
    );

    return;
  }


  if (!numero) {

    alert(
      "Veuillez renseigner votre numéro de réception."
    );

    return;
  }


  try {

    const newRef =
      push(
        ref(
          database,
          "retraits"
        )
      );


    await set(
      newRef,
      {

        id:
          newRef.key,

        vendeurUid:
          currentVendeurUid,

        montant:
          montant,

        moyenPaiement:
          moyen,

        numeroReceiver:
          numero,

        statut:
          "En attente",

        dateDemande:
          new Date().toISOString()

      }
    );


    alert(
      "Demande de retrait transmise avec succès !"
    );


    if (e.target) {

      e.target.reset();

    }


  } catch (error) {

    console.error(
      "Erreur retrait :",
      error
    );


    alert(
      "Erreur lors de la demande de retrait : " +
      error.message
    );

  }

};


/* =========================================================
   HISTORIQUE DES RETRAITS
   ========================================================= */

function chargerRetraits(uid) {

  const retraitsRef =
    ref(
      database,
      "retraits"
    );


  onValue(
    retraitsRef,
    (snapshot) => {

      const tbody =
        getElement(
          "retraitsList"
        );


      if (!tbody) return;


      tbody.innerHTML = "";


      let count = 0;


      if (snapshot.exists()) {

        snapshot.forEach(
          (child) => {

            const ret =
              child.val() || {};


            if (
              ret.vendeurUid !== uid
            ) {

              return;

            }


            count++;


            let badgeClass =
              "status-pending";


            if (
              ret.statut ===
              "Validé"
            ) {

              badgeClass =
                "status-success";

            }


            if (
              ret.statut ===
              "Rejeté"
            ) {

              badgeClass =
                "status-danger";

            }


            const tr =
              document.createElement(
                "tr"
              );


            tr.innerHTML = `

              <td>

                ${
                  ret.dateDemande

                  ?

                  new Date(
                    ret.dateDemande
                  ).toLocaleDateString(
                    "fr-FR"
                  )

                  :

                  ""
                }

              </td>


              <td>

                <strong>

                  ${formatPrix(
                    ret.montant
                  )}

                  FCFA

                </strong>

              </td>


              <td>

                ${escapeHTML(
                  ret.moyenPaiement ||
                  ""
                )}

              </td>


              <td>

                ${escapeHTML(
                  ret.numeroReceiver ||
                  ""
                )}

              </td>


              <td>

                <span
                  class="status-badge ${badgeClass}"
                >

                  ${escapeHTML(
                    ret.statut ||
                    "En attente"
                  )}

                </span>

              </td>

            `;


            tbody.appendChild(
              tr
            );

          }
        );

      }


      if (count === 0) {

        tbody.innerHTML = `

          <tr>

            <td
              colspan="5"
              style="text-align:center;"
            >

              Aucune demande de retrait effectuée.

            </td>

          </tr>

        `;

      }

    }
  );

}

/* =========================================================
   GRAPHIQUES
   ========================================================= */

function initialiserGraphiques() {

  /*
   * Vérification :
   * Chart.js doit être chargé dans le HTML.
   */

  if (
    typeof Chart ===
    "undefined"
  ) {

    console.warn(
      "Chart.js n'est pas chargé."
    );

    return;
  }


  /* -----------------------------------------------------
     GRAPHIQUE PERFORMANCE
     ----------------------------------------------------- */

  const canvasPerf =
    getElement(
      "performanceChart"
    );


  if (
    canvasPerf &&
    !canvasPerf.dataset.initialized
  ) {

    const ctxPerf =
      canvasPerf.getContext(
        "2d"
      );


    new Chart(
      ctxPerf,
      {

        type:
          "line",

        data:
          {

            labels:
              [
                "Jan",
                "Fév",
                "Mar",
                "Avr",
                "Mai",
                "Juin"
              ],

            datasets:
              [

                {

                  label:
                    "Ventes & Gains (FCFA)",

                  data:
                    [
                      120000,
                      190000,
                      300000,
                      250000,
                      420000,
                      550000
                    ],

                  borderColor:
                    "#d4af37",

                  backgroundColor:
                    "rgba(212,175,55,0.1)",

                  fill:
                    true,

                  tension:
                    0.3

                }

              ]

          }

      }
    );


    canvasPerf.dataset.initialized =
      "true";

  }


  /* -----------------------------------------------------
     GRAPHIQUE ANALYTICS
     ----------------------------------------------------- */

  const canvasAnalytics =
    getElement(
      "analyticsChart"
    );


  if (
    canvasAnalytics &&
    !canvasAnalytics.dataset.initialized
  ) {

    const ctxAnalytics =
      canvasAnalytics.getContext(
        "2d"
      );


    new Chart(
      ctxAnalytics,
      {

        type:
          "bar",

        data:
          {

            labels:
              [
                "Semaine 1",
                "Semaine 2",
                "Semaine 3",
                "Semaine 4"
              ],

            datasets:
              [

                {

                  label:
                    "Ventes Directes",

                  data:
                    [
                      50000,
                      75000,
                      60000,
                      90000
                    ],

                  backgroundColor:
                    "#0f172a"

                },


                {

                  label:
                    "Gains Affiliation",

                  data:
                    [
                      15000,
                      25000,
                      20000,
                      35000
                    ],

                  backgroundColor:
                    "#d4af37"

                }

              ]

          }

      }
    );


    canvasAnalytics.dataset.initialized =
      "true";

  }

}


/* =========================================================
   INITIALISATION PAGE

if (

) {

  document.addEventListener(
    "DOMContentLoaded",
    () => {

      afficherDateActuelle();

      initialiserGraphiques();

    }
  );

} else {

  afficherDateActuelle();
