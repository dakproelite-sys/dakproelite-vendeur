<!DOCTYPE html>
<html lang="fr" class="h-full bg-slate-50">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DAKPROELITE - Redirection en cours...</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-full flex flex-col justify-center items-center p-4 antialiased">

  <div class="bg-white rounded-2xl p-8 border border-slate-200 shadow-xl shadow-slate-200/50 max-w-sm w-full text-center">
    <!-- Spinner de chargement -->
    <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-blue-50 text-blue-600 mb-4">
      <svg class="animate-spin h-8 w-8" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
      </svg>
    </div>

    <h2 class="text-lg font-extrabold text-slate-900 mb-1">Connexion en cours...</h2>
    <p class="text-xs text-slate-500 font-medium">Nous préparons votre accès, vous allez être redirigé vers l'accueil...</p>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDR7INHKaazaqZt-xIcjk10JFiy58uXKO8",
      authDomain: "dakproelite.firebaseapp.com",
      databaseURL: "https://dakproelite-default-rtdb.firebaseio.com",
      projectId: "dakproelite",
      storageBucket: "dakproelite.firebasestorage.app",
      messagingSenderId: "580591769206",
      appId: "1:580591769206:web:9dc5fc1ba7d6db46087157"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        try {
          // Définition de l'ID vendeur en session storage pour le catalogue personnalisé
          sessionStorage.setItem('vendeur_connecte', 'true');
          sessionStorage.setItem('vendeur_id', user.uid);

          // Vérification des informations de l'utilisateur dans Realtime Database
          const snapshot = await get(ref(db, 'users/' + user.uid));
          
          // Redirection directe vers la page d'accueil (index.html)
          window.location.replace("index.html");
        } catch (error) {
          console.error("Erreur lors de la vérification du profil :", error);
          window.location.replace("index.html");
        }
      } else {
        // En cas d'absence de session utilisateur, redirection vers connexion
        window.location.replace("connexion.html");
      }
    });
  </script>

</body>
</html>
