<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion / Inscription - Vendeur</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: #f4f6f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .auth-container {
      background: #ffffff;
      width: 100%;
      max-width: 420px;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    }
    .tabs {
      display: flex;
      margin-bottom: 25px;
      border-bottom: 2px solid #e0e0e0;
    }
    .tab-btn {
      flex: 1;
      padding: 12px;
      background: none;
      border: none;
      font-size: 16px;
      font-weight: 600;
      color: #777;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .tab-btn.active {
      color: #0066cc;
      border-bottom: 3px solid #0066cc;
    }
    .form-group {
      margin-bottom: 18px;
    }
    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      color: #333;
    }
    .form-group input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
      outline: none;
    }
    .form-group input:focus {
      border-color: #0066cc;
    }
    .btn-submit {
      width: 100%;
      padding: 12px;
      background-color: #0066cc;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
    .btn-submit:hover {
      background-color: #004fb3;
    }
    .message {
      margin-top: 15px;
      padding: 10px;
      border-radius: 6px;
      font-size: 14px;
      display: none;
      text-align: center;
    }
    .message.error {
      background-color: #ffe6e6;
      color: #d93025;
      display: block;
    }
    .message.success {
      background-color: #e6f4ea;
      color: #137333;
      display: block;
    }
    .form-container {
      display: none;
    }
    .form-container.active {
      display: block;
    }
  </style>
</head>
<body>

  <div class="auth-container">
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('connexion')">Connexion</button>
      <button class="tab-btn" onclick="switchTab('inscription')">Inscription</button>
    </div>

    <div id="feedback-message" class="message"></div>

    <!-- FORMULAIRE DE CONNEXION -->
    <form id="form-connexion" class="form-container active">
      <div class="form-group">
        <label for="login-email">Adresse Email</label>
        <input type="email" id="login-email" required placeholder="exemple@domaine.com">
      </div>
      <div class="form-group">
        <label for="login-password">Mot de passe</label>
        <input type="password" id="login-password" required placeholder="••••••••">
      </div>
      <button type="submit" class="btn-submit">Se connecter</button>
    </form>

    <!-- FORMULAIRE D'INSCRIPTION -->
    <form id="form-inscription" class="form-container">
      <div class="form-group">
        <label for="reg-boutique">Nom de la boutique</label>
        <input type="text" id="reg-boutique" required placeholder="Ma Super Boutique">
      </div>
      <div class="form-group">
        <label for="reg-email">Adresse Email</label>
        <input type="email" id="reg-email" required placeholder="exemple@domaine.com">
      </div>
      <div class="form-group">
        <label for="reg-password">Mot de passe</label>
        <input type="password" id="reg-password" required minlength="6" placeholder="••••••••">
      </div>
      <button type="submit" class="btn-submit">Créer mon compte vendeur</button>
    </form>
  </div>

  <script type="module">
    // Importation directe depuis vos modules npm / vite ou bundler via firebase-config.js
    import { auth, db } from "./firebase-config.js";
    import { 
      signInWithEmailAndPassword, 
      createUserWithEmailAndPassword, 
      onAuthStateChanged 
    } from "firebase/auth";
    import { 
      ref, 
      set 
    } from "firebase/database";

    const feedbackEl = document.getElementById("feedback-message");

    function showMessage(msg, type) {
      feedbackEl.textContent = msg;
      feedbackEl.className = `message ${type}`;
    }

    // Redirection automatique vers profil-vendeur.html si l'utilisateur est déjà connecté
    onAuthStateChanged(auth, (user) => {
      if (user) {
        window.location.href = "profil-vendeur.html";
      }
    });

    // 1. GESTION DE LA CONNEXION
    document.getElementById("form-connexion").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("login-email").value.trim();
      const password = document.getElementById("login-password").value;

      try {
        showMessage("Connexion en cours...", "success");
        await signInWithEmailAndPassword(auth, email, password);
        window.location.href = "profil-vendeur.html";
      } catch (error) {
        console.error(error);
        showMessage("Identifiants incorrects ou compte inexistant.", "error");
      }
    });

    // 2. GESTION DE L'INSCRIPTION
    document.getElementById("form-inscription").addEventListener("submit", async (e) => {
      e.preventDefault();
      const boutique = document.getElementById("reg-boutique").value.trim();
      const email = document.getElementById("reg-email").value.trim();
      const password = document.getElementById("reg-password").value;

      try {
        showMessage("Création du compte en cours...", "success");
        const userCredential = await createUserWithEmailAndPassword(auth, email, password);
        const user = userCredential.user;

        // Enregistrement des informations vendeur dans la base de données Firebase
        await set(ref(db, `vendeurs/${user.uid}`), {
          nomBoutique: boutique,
          email: email,
          role: "vendeur",
          createdAt: new Date().toISOString()
        });

        window.location.href = "profil-vendeur.html";
      } catch (error) {
        console.error(error);
        if (error.code === 'auth/email-already-in-use') {
          showMessage("Cet email est déjà utilisé.", "error");
        } else {
          showMessage("Erreur lors de l'inscription : " + error.message, "error");
        }
      }
    });

    // Gestion du basculement d'onglets (Connexion / Inscription)
    window.switchTab = function(tabName) {
      feedbackEl.style.display = 'none';
      const tabs = document.querySelectorAll('.tab-btn');
      const forms = document.querySelectorAll('.form-container');

      tabs.forEach(tab => tab.classList.remove('active'));
      forms.forEach(form => form.classList.remove('active'));

      if (tabName === 'connexion') {
        tabs[0].classList.add('active');
        document.getElementById('form-connexion').classList.add('active');
      } else {
        tabs[1].classList.add('active');
        document.getElementById('form-inscription').classList.add('active');
      }
    };
  </script>
</body>
</html>
