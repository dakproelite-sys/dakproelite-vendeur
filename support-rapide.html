        async function nettoyerAnciensMessages(dbInstance, currentUid) {
            try {
                const messagesRef = ref(dbInstance, `messages_support/${currentUid}`);
                const snapshot = await get(messagesRef);

                if (snapshot.exists()) {
                    const now = Date.now();
                    const VINGT_QUATRE_HEURES_MS = 24 * 60 * 60 * 1000;

                    snapshot.forEach((childSnapshot) => {
                        const msg = childSnapshot.val();
                        if (msg.timestamp && (now - msg.timestamp > VINGT_QUATRE_HEURES_MS)) {
                            remove(ref(dbInstance, `messages_support/${currentUid}/${childSnapshot.key}`));
                        }
                    });
                }
            } catch (err) {
                console.warn("Nettoyage messages ignoré :", err);
            }
        }

                    <div class="emergency-bar">
                        <span>⚠️ Besoins spécifiques ou assistance directe avec l'équipe ?</span>
                        <div class="emergency-actions">
                            <a href="mailto:${ADMIN_EMAIL}" class="btn-email">
                                ✉️ ${ADMIN_EMAIL}
                            </a>
                            <a id="linkWhatsappDirect" href="https://wa.me/${ADMIN_WHATSAPP}" target="_blank" rel="noopener" class="btn-whatsapp">
                                📲 WhatsApp Direct
                            </a>
                        </div>
                    </div>

                    <div class="info-card">
                        <div style="font-size: 13px; color: #d4af37; font-weight: bold; margin-bottom: 12px; display: flex; align-items: center; gap: 6px;">
                            👤 Profil Client / Vos Coordonnées
                        </div>
                        <div class="form-grid">
                            <div class="field-group">
                                <label>Nom & Prénom</label>
                                <input type="text" id="suppNom" class="form-input" placeholder="Votre nom complet" />
                            </div>
                            <div class="field-group">
                                <label>Téléphone / WhatsApp</label>
                                <input type="tel" id="suppPhone" class="form-input" placeholder="Ex: +229 01 97 45 53 09" />
                            </div>
                            <div class="field-group">
                                <label>E-mail</label>
                                <input type="email" id="suppEmail" class="form-input" placeholder="votre@email.com" />
                            </div>
                        </div>
                    </div>

                    <div class="chat-box" id="chatBox">
                        <div style="color: #888; text-align: center; margin: auto; font-size: 14px;">Chargement de l'assistance DAKPROELITE...</div>
                    </div>

                    <div class="chat-input-area">
                        <input type="text" id="inputSupportMsg" class="form-input" style="flex:1; min-width: 200px;" placeholder="Posez votre question (boutiques, paiements, programme ambassadeur, règlement...)" />
                        <button id="btnMic" class="btn-mic" title="Dictée vocale">🎙️</button>
                        <button id="btnSendMsg" class="btn-send">Envoyer</button>
                    </div>
                </div>
            `;

            const suppNom = document.getElementById("suppNom");
            const suppPhone = document.getElementById("suppPhone");
            const suppEmail = document.getElementById("suppEmail");
            const chatBox = document.getElementById("chatBox");
            const inputMsg = document.getElementById("inputSupportMsg");
            const btnSend = document.getElementById("btnSendMsg");
            const btnMic = document.getElementById("btnMic");
            const linkWhatsappDirect = document.getElementById("linkWhatsappDirect");

            let currentUtterance = null;
            let currentSpeechBtn = null;

            function mettreAJourLienWhatsapp(dernierTexte = "") {
                const nom = suppNom?.value.trim() || "";
                const phone = suppPhone?.value.trim() || "";

                const messageWhatsApp = 
`*--- ASSISTANCE DAKPROELITE ---*
👤 *Client :* ${nom}
📞 *Tél :* ${phone}

💬 *Demande :*
${dernierTexte || "Bonjour, je souhaite obtenir de l'aide sur DAKPROELITE."}`;

                if (linkWhatsappDirect) {
                    linkWhatsappDirect.href = `https://wa.me/${ADMIN_WHATSAPP}?text=${encodeURIComponent(messageWhatsApp)}`;
                }
            }

            window.toggleEcouteMessage = function(btnElement) {
                if (!('speechSynthesis' in window)) {
                    alert("La synthèse vocale n'est pas supportée par votre navigateur.");
                    return;
                }

                const texteRaw = btnElement.getAttribute("data-text") || "";
                const textePropre = nettoyerTexteBrut(texteRaw);

                if (window.speechSynthesis.speaking && currentSpeechBtn === btnElement) {
                    if (window.speechSynthesis.paused) {
                        window.speechSynthesis.resume();
                        btnElement.innerHTML = "⏸️ Pause";
                    } else {
                        window.speechSynthesis.pause();
                        btnElement.innerHTML = "▶️ Reprendre";
                    }
                    return;
                }

                window.speechSynthesis.cancel();
                if (currentSpeechBtn && currentSpeechBtn !== btnElement) {
                    currentSpeechBtn.innerHTML = "🔊 Écouter";
                }

                currentUtterance = new SpeechSynthesisUtterance(textePropre);
                currentUtterance.lang = 'fr-FR';
                currentUtterance.rate = 1.0;
                currentSpeechBtn = btnElement;

                btnElement.innerHTML = "⏸️ Pause";

                currentUtterance.onend = function() {
                    btnElement.innerHTML = "🔊 Écouter";
                    currentSpeechBtn = null;
                };

                currentUtterance.onerror = function() {
                    btnElement.innerHTML = "🔊 Écouter";
                    currentSpeechBtn = null;
                };

                window.speechSynthesis.speak(currentUtterance);
            };

            window.copierTexteMessage = function(btnElement) {
                const texteRaw = btnElement.getAttribute("data-text") || "";
                const textePropre = nettoyerTexteBrut(texteRaw);

                navigator.clipboard.writeText(textePropre).then(() => {
                    const originalHTML = btnElement.innerHTML;
                    btnElement.innerHTML = "✅ Copié !";
                    setTimeout(() => {
                        btnElement.innerHTML = originalHTML;
                    }, 2000);
                }).catch(err => {
                    console.error("Erreur de copie :", err);
                });
            };

            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            let recognition = null;

            if (SpeechRecognition) {
                recognition = new SpeechRecognition();
                recognition.lang = 'fr-FR';
                recognition.continuous = false;
                recognition.interimResults = false;

                recognition.onstart = function() {
                    btnMic.classList.add("listening");
                    btnMic.title = "Écoute en cours... Parlez maintenant";
                };

                recognition.onresult = function(event) {
                    const transcript = event.results[0][0].transcript;
                    if (inputMsg) {
                        inputMsg.value = inputMsg.value ? inputMsg.value + " " + transcript : transcript;
                    }
                };

                recognition.onerror = function(event) {
                    console.warn("Erreur de reconnaissance vocale :", event.error);
                    btnMic.classList.remove("listening");
                };

                recognition.onend = function() {
                    btnMic.classList.remove("listening");
                    btnMic.title = "Dictée vocale";
                };

                btnMic.addEventListener("click", () => {
                    if (btnMic.classList.contains("listening")) {
                        recognition.stop();
                    } else {
                        recognition.start();
                    }
                });
            } else {
                btnMic.style.display = "none";
            }

            const userRef = ref(dbInstance, `users/${currentUid}`);
            get(userRef).then((snapshot) => {
                if (snapshot.exists()) {
                    const data = snapshot.val();
                    if (suppNom) {
                        const nomComplet = [data.nom, data.prenom].filter(Boolean).join(" ");
                        suppNom.value = nomComplet || data.nomClient || "";
                    }
                    if (data.telephone && suppPhone) suppPhone.value = data.telephone;
                    if (data.email && suppEmail) suppEmail.value = data.email;
                } else if (authInstance?.currentUser?.email) {
                    if (suppEmail) suppEmail.value = authInstance.currentUser.email;
                }
                mettreAJourLienWhatsapp();
            }).catch(console.error);

            const messagesRef = ref(dbInstance, `messages_support/${currentUid}`);
            onValue(messagesRef, (snapshot) => {
                if (!chatBox) return;

                if (!snapshot.exists()) {
                    chatBox.innerHTML = `
                        <div style="color: #a0aec0; text-align: center; margin: auto; font-size: 14px; line-height: 1.8; max-width: 600px; background: rgba(255,255,255,0.02); padding: 25px; border-radius: 12px; border: 1px dashed #2c3448;">
                            👋 <strong style="color: #d4af37;">Bienvenue sur l'assistance DAKPROELITE !</strong><br><br>
                            Notre plateforme est conçue pour sécuriser toutes vos ventes et achats à l'échelle internationale.<br><br>
                            Posez une question sur la marketplace, les boutiques, la garantie séquestre, le programme ambassadeur, nos CGU ou notre politique de confidentialité.
                        </div>
                    `;
                    return;
                }

                chatBox.innerHTML = "";
                const messages = snapshot.val();

                Object.entries(messages).forEach(([msgId, msg]) => {
                    const isUser = msg.sender === "user";
                    const containerDiv = document.createElement("div");
                    containerDiv.className = `msg-bubble-container ${isUser ? 'msg-user-container' : 'msg-admin-container'}`;

                    const timeStr = msg.timestamp ? new Date(msg.timestamp).toLocaleTimeString("fr-FR", { hour: '2-digit', minute: '2-digit' }) : '';
                    const texteEchappe = escapeHTML(msg.texte);

                    let htmlContent = `
                        <div class="msg-bubble ${isUser ? 'msg-user' : 'msg-admin'}">
                            <div style="font-size: 11.5px; font-weight: bold; margin-bottom: 5px; opacity: 0.85;">
                                ${isUser ? '👤 Vous' : '🤖 Assistant DAKPROELITE'}
                            </div>
                            <div>${texteEchappe}</div>
                        </div>
                        <div class="msg-meta">
                            <span>${timeStr}</span>
                        </div>
                    `;

                    containerDiv.innerHTML = htmlContent;

                    if (!isUser) {
                        const actionsDiv = document.createElement("div");
                        actionsDiv.className = "msg-actions";
                        
                        const btnCopier = document.createElement("button");
                        btnCopier.className = "btn-msg-action";
                        btnCopier.setAttribute("data-text", msg.texte);
                        btnCopier.innerHTML = "📋 Copier";
                        btnCopier.onclick = function() { window.copierTexteMessage(this); };

                        const btnEcouter = document.createElement("button");
                        btnEcouter.className = "btn-msg-action";
                        btnEcouter.setAttribute("data-text", msg.texte);
                        btnEcouter.innerHTML = "🔊 Écouter";
                        btnEcouter.onclick = function() { window.toggleEcouteMessage(this); };

                        actionsDiv.appendChild(btnCopier);
                        actionsDiv.appendChild(btnEcouter);
                        containerDiv.appendChild(actionsDiv);
                    }

                    chatBox.appendChild(containerDiv);
                });

                chatBox.scrollTop = chatBox.scrollHeight;
            });

            async function sendMessage() {
                const nom = suppNom?.value.trim() || "";
                const phone = suppPhone?.value.trim() || "";
                const email = suppEmail?.value.trim() || "";
                const text = inputMsg?.value.trim() || "";

                if (!text) return;

                if (inputMsg) inputMsg.value = "";

                try {
                    await set(ref(dbInstance, `users/${currentUid}/coordonnees`), {
                        nom,
                        telephone: phone,
                        email
                    }).catch(() => {});

                    await push(ref(dbInstance, `messages_support/${currentUid}`), {
                        sender: "user",
                        texte: text,
                        timestamp: serverTimestamp(),
                        nomClient: nom,
                        telephoneClient: phone,
                        emailClient: email
                    });

                    mettreAJourLienWhatsapp(text);

                    const reponseBot = obtenirReponseAutomatique(text);

                    setTimeout(async () => {
                        await push(ref(dbInstance, `messages_support/${currentUid}`), {
                            sender: "bot",
                            texte: reponseBot,
                            timestamp: serverTimestamp()
                        });
                    }, 400);

                } catch (e) {
                    console.error("Erreur Envoi Support :", e);
                }
            }

            btnSend?.addEventListener("click", sendMessage);
            inputMsg?.addEventListener("keypress", (e) => {
                if (e.key === "Enter") sendMessage();
            });
        }

        const container = document.getElementById("supportContainer");
        onAuthStateChanged(auth, (user) => {
            if (user) {
                init(container, db, auth, user.uid);
            } else {
                init(container, db, auth, null);
            }
        });
    </script>
</body>
</html>
