<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support Rapide | DAKPRO ÉLITE</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { 
            --gold: #d4af37; 
            --gold-light: #f3e5ab;
            --dark: #050505; 
            --soft-dark: #12161f; 
            --card-bg: #1a2230;
            --whatsapp: #25d366;
            --whatsapp-hover: #20ba5a;
        }
        
        body { 
            margin: 0; 
            font-family: 'Poppins', sans-serif; 
            background: var(--dark); 
            color: #fff; 
            display: flex; 
            flex-direction: column; 
            min-height: 100vh; 
        }
        
        .header { 
            background: linear-gradient(to bottom, #131921, #000); 
            padding: 15px 20px; 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            border-bottom: 2px solid var(--gold); 
        }
        
        .logo { 
            width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--gold); 
            object-fit: cover; 
        }

        .back-link {
            color: var(--gold);
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
        }
        .back-link:hover { text-decoration: underline; }

        .main-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .contact-card {
            background: var(--card-bg);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 15px;
            padding: 25px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.6);
            box-sizing: border-box;
        }

        .contact-card h2 {
            color: var(--gold);
            margin-top: 0;
            font-size: 1.4rem;
            text-align: center;
            margin-bottom: 5px;
        }

        .contact-card p.subtitle {
            text-align: center;
            color: #aaa;
            font-size: 12px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .form-group label {
            font-size: 12px;
            font-weight: 600;
            color: var(--gold-light);
        }

        .form-group input, 
        .form-group textarea {
            padding: 12px;
            border-radius: 8px;
            border: 1px solid rgba(212, 175, 55, 0.4);
            background: #000;
            color: #fff;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus, 
        .form-group textarea:focus {
            border-color: var(--gold);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 120px;
        }

        .btn-whatsapp {
            background: var(--whatsapp);
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background 0.2s, transform 0.1s;
            margin-top: 10px;
        }

        .btn-whatsapp:hover {
            background: var(--whatsapp-hover);
        }

        .btn-whatsapp:active {
            transform: scale(0.98);
        }

        .app-footer { 
            background: #131921; 
            color: #777; 
            text-align: center; 
            padding: 15px; 
            font-size: 10px; 
            border-top: 1px solid #222; 
        }
    </style>
</head>
<body>

<header class="header">
    <img class="logo" src="https://i.postimg.cc/WpSc29mX/file-00000000ca8872438c17222eb828bc0c.png" alt="Logo">
    <a href="index.html" class="back-link">← Retour à l'accueil</a>
</header>

<div class="main-container">
    <div class="contact-card">
        <h2>Support Rapide</h2>
        <p class="subtitle">Envoyez-nous un message, nous vous répondrons directement sur WhatsApp.</p>
        
        <form id="supportForm">
            <div class="form-group">
                <label for="nom">Nom</label>
                <input type="text" id="nom" placeholder="Votre nom" required>
            </div>

            <div class="form-group">
                <label for="prenom">Prénom</label>
                <input type="text" id="prenom" placeholder="Votre prénom" required>
            </div>

            <div class="form-group">
                <label for="email">Adresse E-mail</label>
                <input type="email" id="email" placeholder="votre.email@example.com" required>
            </div>

            <div class="form-group">
                <label for="message">Votre Message</label>
                <textarea id="message" placeholder="Exprimez votre besoin ou posez votre question ici..." required></textarea>
            </div>

            <button type="submit" class="btn-whatsapp">
                <span>💬</span> Envoyer sur WhatsApp
            </button>
        </form>
    </div>
</div>

<footer class="app-footer">
    &copy; 2026 DAKPRO ÉLITE / DAKPRO NEXUS. Tous droits réservés.
</footer>

<script>
    document.getElementById('supportForm').addEventListener('submit', function(e) {
        e.preventDefault();

        // Récupération des valeurs des champs
        const nom = document.getElementById('nom').value.trim();
        const prenom = document.getElementById('prenom').value.trim();
        const email = document.getElementById('email').value.trim();
        const message = document.getElementById('message').value.trim();

        // Numéro WhatsApp cible
        const phoneNumber = "2290197455309";

        // Construction du message formaté proprement pour WhatsApp
        const whatsappMessage = `*Nouveau message de Support - DAKPRO ÉLITE*\n\n` +
                                `*Nom :* ${nom}\n` +
                                `*Prénom :* ${prenom}\n` +
                                `*E-mail :* ${email}\n\n` +
                                `*Message :*\n${message}`;

        // Encodage de l'URL pour WhatsApp
        const encodedMessage = encodeURIComponent(whatsappMessage);
        const whatsappURL = `https://wa.me/${phoneNumber}?text=${encodedMessage}`;

        // Redirection vers l'application / web WhatsApp
        window.location.href = whatsappURL;
    });
</script>

</body>
</html>
