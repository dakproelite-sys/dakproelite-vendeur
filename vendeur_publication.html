<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DAKPROÉLITE — Publication vendeur</title>
<meta name="theme-color" content="#007bff">

<style>
:root{
 --w:#fff;--bg:#050505;--blue:#007bff;--cyan:#00a8ff;
 --red:#e50914;--text:#080b10;--muted:#64748b;
 --border:#d7e5f2;--shadow:0 20px 55px #0008;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
 font-family:Arial,sans-serif;min-height:100vh;padding:18px;color:var(--text);
 background:
 radial-gradient(circle at 10% 5%,#00a8ff38,transparent 28%),
 radial-gradient(circle at 90% 5%,#e5091428,transparent 25%),
 linear-gradient(135deg,#020202,#111318,#020202);
}
.wrap{max-width:850px;margin:auto}
header{text-align:center;color:white;margin:10px 0 22px}
header h1{font-size:29px;font-weight:900}
header p{margin-top:8px;color:#dbeafe;font-size:14px}
.logo{
 width:75px;height:75px;object-fit:contain;border-radius:18px;
 background:white;padding:7px;margin-bottom:10px;
 border:2px solid var(--cyan);box-shadow:0 0 25px #00a8ff55
}
.card{
 background:linear-gradient(145deg,#fff,#f1f8ff);
 border-radius:20px;padding:22px;box-shadow:var(--shadow);
 border-top:6px solid var(--blue)
}
.auth{
 padding:12px 14px;border-radius:12px;background:#eef8ff;
 border:1px solid #b7dcff;color:#07549a;font-weight:bold;margin-bottom:18px
}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.full{grid-column:1/-1}
label{display:block;font-weight:800;font-size:14px;margin-bottom:7px}
input,select,textarea{
 width:100%;padding:12px;border:1px solid var(--border);border-radius:11px;
 background:#fff;font-size:15px;outline:none
}
input:focus,select:focus,textarea:focus{
 border-color:var(--blue);box-shadow:0 0 0 3px #007bff18
}
textarea{min-height:120px;resize:vertical}
.drop{
 padding:25px 15px;text-align:center;border:2px dashed #9bbde0;
 border-radius:15px;background:#fff;cursor:pointer
}
.drop:hover{border-color:var(--blue);background:#eef8ff}
.drop b{display:block;color:var(--blue);font-size:16px;margin-bottom:7px}
#file{display:none}
.info,.preview,.download,.progress,.msg{display:none;margin-top:13px}
.info,.download{
 padding:12px;border-radius:12px;background:#f2f8ff;border:1px solid #bfddf7
}
.preview img,.preview video{
 width:100%;max-height:350px;object-fit:contain;border-radius:12px;background:#050505
}
.preview{display:none}
.preview.on,.info.on,.download.on,.progress.on,.msg.on{display:block}
.doc{text-align:center;padding:25px;background:#f5f9fd;border-radius:12px}
.progress{background:#08090b;padding:12px;border-radius:12px;color:white}
.bar{height:9px;background:#292c32;border-radius:20px;overflow:hidden;margin-top:8px}
.fill{
 height:100%;width:0;background:linear-gradient(90deg,#0057ff,#00a8ff,#ff1f35)
}
.msg{padding:12px;border-radius:11px;font-weight:bold}
.success{background:#eaf7ff;color:#0057a8;border:1px solid #83c7ff}
.error{background:#fff0f2;color:#b9000b;border:1px solid #ffb5bd}
button{
 width:100%;margin-top:18px;padding:15px;border:0;border-radius:12px;
 background:linear-gradient(135deg,#0057ff,#007bff,#00a8ff);
 color:white;font-size:16px;font-weight:900;cursor:pointer;
 box-shadow:0 12px 30px #007bff55
}
button:disabled{opacity:.55;cursor:not-allowed}
footer{text-align:center;color:#b9c5d3;font-size:12px;margin:18px}
@media(max-width:650px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.card{padding:16px}}
</style>
</head>

<body>
<div class="wrap">

<header>
<img class="logo"
 src="https://i.postimg.cc/placeholder/dakproelite-logo.png"
 alt="DAKPROÉLITE"
 onerror="this.style.display='none'">
<h1>DAKPROÉLITE</h1>
<p>Publiez vos produits, cours, épreuves, vidéos et documents.</p>
</header>

<main class="card">

<div id="auth" class="auth">Vérification de votre connexion...</div>

<form id="form">

<div class="grid">

<div>
<label>Type de publication *</label>
<select id="type" required>
<option value="">Choisir</option>
<option value="produit">Produit</option>
<option value="cours">Cours</option>
<option value="epreuve">Épreuve</option>
<option value="document">Document</option>
<option value="video">Vidéo</option>
</select>
</div>

<div>
<label>Catégorie *</label>
<input id="categorie" maxlength="80" placeholder="Ex : Électronique" required>
</div>

<div class="full">
<label>Nom / titre *</label>
<input id="nom" maxlength="150" placeholder="Nom du produit ou titre" required>
</div>

<div>
<label>Vendeur / auteur *</label>
<input id="auteur" maxlength="120" placeholder="Votre nom" required>
</div>

<div>
<label>Stock *</label>
<input id="stock" type="number" min="0" step="1" value="100" required>
</div>

<div>
<label>Prix normal (FCFA) *</label>
<input id="prixNormal" type="number" min="0" step="1" required>
</div>

<div>
<label>Prix promotionnel</label>
<input id="prixPromo" type="number" min="0" step="1">
</div>

<div class="full">
<label>Description *</label>
<textarea id="description" maxlength="5000"
placeholder="Décrivez clairement votre produit ou contenu..." required></textarea>
</div>

<div class="full">
<label>Photo, vidéo ou document *</label>

<div id="drop" class="drop">
<div style="font-size:40px">📁</div>
<b>Choisir un fichier</b>
<span>Image • Vidéo • PDF • Word • Excel • PowerPoint • TXT • ZIP</span>
<input id="file" type="file"
accept="image/*,video/*,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.csv,.zip">
</div>

<div id="info" class="info">
<strong id="fname"></strong>
<div id="fmeta"></div>
</div>

<div id="preview" class="preview"></div>

<div id="download" class="download">
<label>
<input id="downloadable" type="checkbox" style="width:auto">
 Autoriser le téléchargement
</label>
</div>
</div>

</div>

<div id="progress" class="progress">
<div style="display:flex;justify-content:space-between">
<span id="ptxt">Préparation...</span>
<span id="pct">0%</span>
</div>
<div class="bar"><div id="fill" class="fill"></div></div>
</div>

<div id="msg" class="msg"></div>

<button id="submit" type="submit" disabled>
🚀 Publier maintenant
</button>

</form>
</main>

<footer>© 2026 DAKPROÉLITE / DAKPRO NEXUS</footer>
</div>

<script type="module">

/* ============================================================
   FIREBASE — NE PAS MODIFIER
============================================================ */

import {
 ref,push,set
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

import {
 onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

import {
 getStorage,ref as sRef,uploadBytesResumable,
 getDownloadURL,deleteObject
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

import {
 auth,database
} from "./firebase-config.js";


/* ============================================================
   CONFIGURATION
============================================================ */

const NODE="vendeur_publications";

/*
   IMPORTANT :
   Si ton tableau vendeur porte un autre nom,
   change uniquement cette ligne.
*/
const REDIRECT_URL="./vendeur.html";

const MAX_VIDEO=250*1024*1024;
const MAX_DOC=100*1024*1024;
const MAX_IMAGE=1600;


/* ============================================================
   ELEMENTS
============================================================ */

const $=id=>document.getElementById(id);

const form=$("form");
const fileInput=$("file");
const drop=$("drop");
const submit=$("submit");
const authBox=$("auth");
const msg=$("msg");
const progress=$("progress");
const fill=$("fill");
const pct=$("pct");
const ptxt=$("ptxt");

let user=null;
let file=null;
let uploadFile=null;
let mediaType=null;
let publishing=false;


/* ============================================================
   AUTHENTIFICATION
============================================================ */

onAuthStateChanged(auth,u=>{

 user=u;

 if(u){

   authBox.textContent="🟦 Connecté — vous pouvez publier.";
   submit.disabled=false;

 }else{

   authBox.textContent="🔴 Vous devez être connecté pour publier.";
   submit.disabled=true;

 }

});


/* ============================================================
   OUTILS
============================================================ */

function message(text,type="error"){
 msg.textContent=text;
 msg.className="msg on "+type;
}

function progressBar(n,text){
 progress.classList.add("on");
 fill.style.width=n+"%";
 pct.textContent=Math.round(n)+"%";
 ptxt.textContent=text;
}

function hideProgress(){
 progress.classList.remove("on");
 fill.style.width="0%";
}

function bytes(n){
 if(!n)return"0 octet";
 const u=["octets","Ko","Mo","Go"];
 let i=0;
 while(n>=1024&&i<3){n/=1024;i++}
 return n.toFixed(n>=10?1:2)+" "+u[i];
}

function ext(name){
 return name.split(".").pop().toLowerCase();
}

const docs=new Set([
 "pdf","doc","docx","xls","xlsx","ppt","pptx",
 "txt","csv","zip"
]);

function typeOf(f){

 if(f.type.startsWith("image/"))return"image";
 if(f.type.startsWith("video/"))return"video";
 if(docs.has(ext(f.name)))return"document";

 return null;
}

function safeName(name){

 return name
 .normalize("NFD")
 .replace(/[\u0300-\u036f]/g,"")
 .replace(/[^a-zA-Z0-9._-]/g,"-")
 .replace(/-+/g,"-")
 .slice(0,100);

}


/* ============================================================
   APERCU
============================================================ */

function previewFile(f,type){

 const box=$("preview");
 box.innerHTML="";

 if(type==="image"||type==="video"){

   const el=document.createElement(type==="image"?"img":"video");

   el.src=URL.createObjectURL(f);

   if(type==="video")el.controls=true;

   box.appendChild(el);

 }else{

   box.innerHTML=`
   <div class="doc">
   <div style="font-size:50px">📄</div>
   <strong>Document sélectionné</strong>
   <p>${safeName(f.name)}</p>
   </div>`;

 }

 box.className="preview on";
}


/* ============================================================
   OPTIMISATION IMAGE
============================================================ */

async function optimizeImage(f){

 const url=URL.createObjectURL(f);

 const img=new Image();

 await new Promise((resolve,reject)=>{

   img.onload=resolve;
   img.onerror=reject;
   img.src=url;

 });

 let w=img.naturalWidth;
 let h=img.naturalHeight;
 const ratio=Math.min(1,MAX_IMAGE/Math.max(w,h));

 w=Math.round(w*ratio);
 h=Math.round(h*ratio);

 const canvas=document.createElement("canvas");
 canvas.width=w;
 canvas.height=h;

 const ctx=canvas.getContext("2d");

 ctx.fillStyle="#fff";
 ctx.fillRect(0,0,w,h);
 ctx.drawImage(img,0,0,w,h);

 const blob=await new Promise(resolve=>
   canvas.toBlob(resolve,"image/jpeg",.82)
 );

 URL.revokeObjectURL(url);

 return new File(
   [blob],
   safeName(f.name.replace(/\.[^.]+$/,""))+".jpg",
   {type:"image/jpeg"}
 );

}


/* ============================================================
   SELECTION FICHIER
============================================================ */

async function selectFile(f){

 if(!f)return;

 msg.className="msg";

 const type=typeOf(f);

 if(!type){
   message("❌ Type de fichier non autorisé.");
   return;
 }

 if(type==="video"&&f.size>MAX_VIDEO){
   message("❌ Vidéo limitée à 250 Mo.");
   return;
 }

 if(type==="document"&&f.size>MAX_DOC){
   message("❌ Document limité à 100 Mo.");
   return;
 }

 file=f;
 mediaType=type;
 uploadFile=f;

 if(type==="image"){

   try{
     progressBar(10,"Optimisation de l'image...");
     uploadFile=await optimizeImage(f);
   }catch(e){
     message("❌ Impossible d'optimiser cette image.");
     return;
   }

 }

 $("info").className="info on";
 $("fname").textContent=f.name;
 $("fmeta").textContent=
 `${type.toUpperCase()} • Original : ${bytes(f.size)}`
 +(type==="image"?` • Optimisée : ${bytes(uploadFile.size)}`:"");

 previewFile(uploadFile,type);

 $("download").className=
 type==="image"?"download":"download on";

 $("downloadable").checked=false;

 hideProgress();
}

fileInput.onchange=e=>selectFile(e.target.files[0]);

drop.onclick=()=>fileInput.click();

drop.ondragover=e=>{
 e.preventDefault();
 drop.style.borderColor="#007bff";
};

drop.ondragleave=()=>{
 drop.style.borderColor="";
};

drop.ondrop=e=>{
 e.preventDefault();
 drop.style.borderColor="";
 selectFile(e.dataTransfer.files[0]);
};


/* ============================================================
   FIREBASE STORAGE
============================================================ */

function uploadMedia(f,uid){

 const storage=getStorage();

 const filename=
 `${uid}-${Date.now()}-${safeName(f.name)}`;

 const path=
 `vendeur_publications/${uid}/${filename}`;

 const storageReference=sRef(storage,path);

 const task=uploadBytesResumable(
   storageReference,
   f,
   {
     contentType:f.type||"application/octet-stream",
     customMetadata:{
       uploadedBy:uid,
       originalName:f.name,
       app:"DAKPROELITE"
     }
   }
 );

 return new Promise((resolve,reject)=>{

   task.on("state_changed",

     snap=>{

       const p=snap.totalBytes?
       snap.bytesTransferred/snap.totalBytes*100:0;

       progressBar(p,"Envoi du fichier...");

     },

     reject,

     async()=>{

       try{

         const url=
         await getDownloadURL(task.snapshot.ref);

         resolve({
           url,
           path,
           name:filename,
           size:f.size,
           mimeType:f.type,
           ref:task.snapshot.ref
         });

       }catch(e){
         reject(e);
       }

     }

   );

 });

}


/* ============================================================
   PUBLICATION
============================================================ */

form.onsubmit=async e=>{

 e.preventDefault();

 if(publishing)return;

 if(!user){
   message("❌ Connectez-vous avant de publier.");
   return;
 }

 if(!file||!uploadFile){
   message("❌ Sélectionnez un fichier.");
   return;
 }

 publishing=true;
 submit.disabled=true;

 let uploaded=null;

 try{

   const type=$("type").value;
   const categorie=$("categorie").value.trim();
   const nom=$("nom").value.trim();
   const auteur=$("auteur").value.trim();
   const description=$("description").value.trim();

   const prixNormal=Number($("prixNormal").value);
   const promoValue=$("prixPromo").value;
   const prixPromo=
   promoValue===""?null:Number(promoValue);

   const stock=Number($("stock").value);

   if(!type||!categorie||!nom||!auteur||!description)
     throw new Error("Veuillez remplir tous les champs obligatoires.");

   if(!Number.isInteger(prixNormal)||prixNormal<0)
     throw new Error("Prix normal invalide.");

   if(
     prixPromo!==null&&
     (!Number.isInteger(prixPromo)||prixPromo<0)
   )
     throw new Error("Prix promotionnel invalide.");

   if(
     prixPromo!==null&&
     prixPromo>=prixNormal&&
     prixNormal>0
   )
     throw new Error("Le prix promotionnel doit être inférieur au prix normal.");

   if(!Number.isInteger(stock)||stock<0)
     throw new Error("Stock invalide.");

   progressBar(0,"Préparation...");

   uploaded=await uploadMedia(uploadFile,user.uid);

   const publicationRef=
   push(ref(database,NODE));

   const id=publicationRef.key;

   const now=new Date().toISOString();

   const publication={

     id,
     type,
     categorie,
     nom,
     auteur,

     prixNormal,
     prixPromo,

     prix:
       prixPromo!==null
       ?prixPromo
       :prixNormal,

     stock,
     description,

     imageUrl:
       mediaType==="image"
       ?uploaded.url
       :"",

     mediaUrl:uploaded.url,
     mediaPath:uploaded.path,
     mediaName:file.name,
     storageFileName:uploaded.name,

     typeMedia:mediaType,
     mimeType:uploaded.mimeType,

     fileSize:uploaded.size,
     originalFileSize:file.size,

     downloadable:
       mediaType==="image"
       ?false
       :$("downloadable").checked,

     createdBy:user.uid,
     sellerId:user.uid,

     statut:"active",
     createdAt:now,
     updatedAt:now

   };

   await set(publicationRef,publication);

   progressBar(100,"Publication enregistrée.");

   message(
     "✅ Publication réussie ! Redirection...",
     "success"
   );

   form.reset();

   file=null;
   uploadFile=null;
   mediaType=null;

   $("info").className="info";
   $("preview").className="preview";
   $("download").className="download";

   /*
      REDIRECTION
   */
   setTimeout(()=>{
     window.location.href=REDIRECT_URL;
   },1200);

 }catch(error){

   console.error(error);

   if(uploaded?.ref){

     try{
       await deleteObject(uploaded.ref);
     }catch(cleanup){
       console.error("Nettoyage Storage:",cleanup);
     }

   }

   let text=error?.message||"Erreur pendant la publication.";

   if(error?.code==="storage/unauthorized")
     text="Firebase Storage refuse l'envoi. Vérifiez vos règles Storage.";

   if(error?.code==="storage/quota-exceeded")
     text="La capacité Firebase Storage est insuffisante.";

   message("❌ "+text);

   hideProgress();

 }finally{

   publishing=false;
   submit.disabled=!user;

 }

};

</script>
</body>
</html>
