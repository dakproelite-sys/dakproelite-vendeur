<script type="module">


/* ============================================================
   FIREBASE
============================================================ */

import {
  ref,
  push,
  set
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";


import {
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";


import {
  getStorage,
  ref as storageRef,
  uploadBytesResumable,
  getDownloadURL,
  deleteObject
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";


import {
  auth,

} from "./firebase-config.js";


/* ============================================================
   CONFIGURATION
============================================================ */


/*
IMPORTANT :

Le nom doit rester exactement :

vendeur_publications
*/

const NODE =
  "vendeur_publications";


/*
Page de retour après publication.
*/

const REDIRECT_URL =
  "./vendeur.html";


/*
Limites.
*/

const MAX_VIDEO =
  250 * 1024 * 1024;


const MAX_DOCUMENT =
  100 * 1024 * 1024;


/*
Taille maximale du côté le plus long
pour les images compressées.
*/

const MAX_IMAGE =
  1600;


/* ============================================================
   ELEMENTS
============================================================ */

const $ =
  id => document.getElementById(id);


const form =
  $("form");


const fileInput =
  $("file");


const drop =
  $("drop");

  $("msg");

  $("progress");


const fill =
  $("fill");

  $("pct");


const ptxt =
  $("ptxt");


/* ============================================================
   ETAT
============================================================ */

let user =
  null;


let selectedFile =
  null;


let uploadFile =
  null;


let mediaType =
  null;


let publishing =

/* ============================================================

function progressBar(

/* ============================================================
   TAILLE FICHIER
============================================================ */

function bytes(size){

  if(!size){

    return "0 octet";

  }


  const units = [
    "octets",
    "Ko",
    "Mo",
    "Go"
  ];


  let i =
    0;


  let value =
    size;


  while(
    value >= 1024 &&
    i < units.length - 1
  ){

    value /=
      1024;

    i++;

  }


  return (
    value.toFixed(
      value >= 10
      ? 1
      : 2
    )
    + " "
    + units[i]
  );

}


/* ============================================================
   EXTENSION
============================================================ */

function ext(name){

  const parts =
    String(
      name || ""
    ).split(".");


  return (
    parts.length > 1
    ? parts.pop()
    : ""
  ).toLowerCase();

}


/* ============================================================
   EXTENSIONS AUTORISEES
============================================================ */

const imageExtensions =
  new Set([

    "jpg",
    "jpeg",
    "png",
    "webp",
    "gif",
    "bmp",
    "avif",
    "heic",
    "heif"

  ]);


const videoExtensions =
  new Set([

    "mp4",
    "mov",
    "m4v",
    "avi",
    "mkv",
    "webm",
    "3gp",
    "mpeg",
    "mpg"

  ]);


const documentExtensions =
  new Set([

    "pdf",
    "doc",
    "docx",
    "xls",
    "xlsx",
    "ppt",
    "pptx",
    "txt",
    "csv",
    "zip"

  ]);


/* ============================================================
   DETECTION ROBUSTE DU TYPE
============================================================ */

function detectType(file){

  if(!file){

    return null;

  }


  const mime =
    String(
      file.type || ""
    ).toLowerCase();


  const extension =
    ext(file.name);


  /* IMAGE */

  if(
    mime.startsWith("image/") ||
    imageExtensions.has(
      extension
    )
  ){

    return "image";

  }


  /* VIDEO */

  if(
    mime.startsWith("video/") ||
    videoExtensions.has(
      extension
    )
  ){

    return "video";

  }


  /* DOCUMENT */

  if(
    documentExtensions.has(
      extension
    )
  ){

    return "document";

  }


  return null;

}


/* ============================================================
   NOM SECURISE
============================================================ */

function safeName(name){

  return String(
    name || "fichier"
  )

    .normalize("NFD")

    .replace(
      /[\u0300-\u036f]/g,
      ""
    )

    .replace(
      /[^a-zA-Z0-9._-]/g,
      "-"
    )

    .replace(
      /-+/g,
      "-"
    )

    .slice(
      0,
      100
    );

}


/* ============================================================
   APERCU
============================================================ */

function previewFile(
  file,
  type
){

  const box =
    $("preview");


  box.innerHTML =
    "";


  if(
    type === "image" ||
    type === "video"
  ){

    const element =
      document.createElement(
        type === "image"
        ? "img"
        : "video"
      );


    const objectURL =
      URL.createObjectURL(
        file
      );


    element.src =
      objectURL;


    if(type === "image"){

      element.alt =
        "Aperçu de l'image";


      element.onload =
        () => {

          setTimeout(
            () => {

              URL.revokeObjectURL(
                objectURL
              );

            },
            1000
          );

        };


      element.onerror =
        () => {

          URL.revokeObjectURL(
            objectURL
          );

          /*
          L'upload peut quand même
          continuer si le navigateur
          ne sait pas afficher le format.
          */

        };

    }else{

      element.controls =
        true;

      element.playsInline =
        true;

      element.preload =
        "metadata";


      element.onloadeddata =
        () => {

          setTimeout(
            () => {

              URL.revokeObjectURL(
                objectURL
              );

            },
            1000
          );

        };

    }


    box.appendChild(
      element
    );

  }else{

    const div =
      document.createElement(
        "div"
      );


    div.className =
      "doc";


    const icon =
      document.createElement(
        "div"
      );


    icon.className =
      "doc-icon";


    icon.textContent =
      "📄";


    const title =
      document.createElement(
        "strong"
      );


    title.textContent =
      "Document sélectionné";


    const name =
      document.createElement(
        "p"
      );


    name.textContent =
      safeName(
        file.name
      );


    div.appendChild(
      icon
    );


    div.appendChild(
      title
    );


    div.appendChild(
      name
    );


    box.appendChild(
      div
    );

  }


  box.className =
    "preview on";

}


/* ============================================================
   COMPRESSION IMAGE
============================================================ */

async function compressImage(
  file
){

  const extension =
    ext(
      file.name
    );


  /*
  HEIC / HEIF :

  Certains navigateurs ne savent pas
  convertir ces formats avec Canvas.

  Dans ce cas on conserve le fichier original.
  */


  if(
    extension === "heic" ||
    extension === "heif"
  ){

    return file;

  }


  /*
  Si le fichier est déjà petit,
  on peut tout de même le convertir
  en JPEG pour standardiser l'image.
  */


  const objectURL =
    URL.createObjectURL(
      file
    );


  const img =
    new Image();


  try{

    await new Promise(
      (
        resolve,
        reject
      ) => {

        img.onload =
          resolve;


        img.onerror =
          () => {

            reject(
              new Error(
                "Format d'image non compatible."
              )
            );

          };


        img.src =
          objectURL;

      }
    );


    let width =
      img.naturalWidth;


    let height =
      img.naturalHeight;


    if(
      !width ||
      !height
    ){

      throw new Error(
        "Dimensions d'image invalides."
      );

    }


    /*
    Réduction à maximum 1600 px
    sur le côté le plus long.
    */

    const ratio =
      Math.min(
        1,
        MAX_IMAGE /
        Math.max(
          width,
          height
        )
      );


    width =
      Math.max(
        1,
        Math.round(
          width * ratio
        )
      );


    height =
      Math.max(
        1,
        Math.round(
          height * ratio
        )
      );


    const canvas =
      document.createElement(
        "canvas"
      );


    canvas.width =
      width;


    canvas.height =
      height;


    const ctx =
      canvas.getContext(
        "2d"
      );


    if(!ctx){

      throw new Error(
        "Canvas indisponible."
      );

    }


    /*
    Fond blanc pour éviter
    les problèmes de transparence
    lors de la conversion JPEG.
    */

    ctx.fillStyle =
      "#ffffff";


    ctx.fillRect(
      0,
      0,
      width,
      height
    );


    ctx.drawImage(
      img,
      0,
      0,
      width,
      height
    );


    const blob =
      await new Promise(
        resolve => {

          canvas.toBlob(
            resolve,
            "image/jpeg",
            0.82
          );

        }
      );


    if(!blob){

      throw new Error(
        "Compression impossible."
      );

    }


    const newName =
      safeName(
        file.name.replace(
          /\.[^.]+$/,
          ""
        )
      ) + ".jpg";


    return new File(
      [blob],
      newName,
      {
        type:
          "image/jpeg",

        lastModified:
          Date.now()

      }
    );

  }finally{

    URL.revokeObjectURL(
      objectURL
    );

  }

}


/* ============================================================
   SELECTION FICHIER
============================================================ */

async function selectFile(
  file
){

  if(!file){

    return;

  }


  msg.className =
    "msg";


  hideProgress();


  const type =
    detectType(
      file
    );


  if(!type){

    message(
      "❌ Ce fichier n'est pas reconnu. Choisissez une image, une vidéo ou un document autorisé."
    );

    return;

  }


  /* ========================================================
     LIMITE VIDEO
  ======================================================== */

  if(
    type === "video" &&
    file.size > MAX_VIDEO
  ){

    message(
      "❌ Cette vidéo dépasse la limite de 250 Mo."
    );

    return;

  }


  /* ========================================================
     LIMITE DOCUMENT
  ======================================================== */

  if(
    type === "document" &&
    file.size > MAX_DOCUMENT
  ){

    message(
      "❌ Ce document dépasse la limite de 100 Mo."
    );

    return;

  }


  /*
  On conserve le fichier original
  pour les informations et la publication.
  */

  selectedFile =
    file;


  mediaType =
    type;


  uploadFile =
    file;


  /* ========================================================
     IMAGE
  ======================================================== */

  if(type === "image"){

    try{

      progressBar(
        5,
        "Compression de l'image..."
      );


      uploadFile =
        await compressImage(
          file
        );


    }catch(error){

      console.warn(
        "Compression impossible. Fichier original utilisé.",
        error
      );


      uploadFile =
        file;

    }

  }


  /* ========================================================
     INFORMATIONS
  ======================================================== */

  $("info").className =
    "info on";


  $("fname").textContent =
    file.name;


  let metadata =
    type.toUpperCase()
    + " • Original : "
    + bytes(
      file.size
    );


  if(
    type === "image" &&
    uploadFile !== file
  ){

    metadata +=
      " • Après compression : "
      + bytes(
        uploadFile.size
      );

  }


  $("fmeta").textContent =
    metadata;


  /* ========================================================
     APERCU
  ======================================================== */

  previewFile(
    uploadFile,
    type
  );


  /* ========================================================
     TELECHARGEMENT
  ======================================================== */

  if(
    type === "image"
  ){

    $("download").className =
      "download";

  }else{

    $("download").className =
      "download on";

  }


  $("downloadable").checked =
    false;


  hideProgress();

}


/* ============================================================
   OUVRIR LE SELECTEUR
============================================================ */

function openPicker(){

  /*
  Permet de sélectionner
  deux fois exactement
  le même fichier.
  */

  fileInput.value =
    "";


  fileInput.click();

}


/* ============================================================
   CLIC SUR LA ZONE
============================================================ */

drop.addEventListener(
  "click",
  event => {

    event.preventDefault();

    openPicker();

  }
);


/* ============================================================
   CLAVIER
============================================================ */

drop.addEventListener(
  "keydown",
  event => {

    if(
      event.key === "Enter" ||
      event.key === " "
    ){

      event.preventDefault();

      openPicker();

    }

  }
);


/* ============================================================
   FICHIER SELECTIONNE
============================================================ */

fileInput.addEventListener(
  "change",
  event => {

    const file =
      event.target.files?.[0];


    selectFile(
      file
    );

  }
);


/* ============================================================
   DRAG & DROP
============================================================ */

drop.addEventListener(
  "dragover",
  event => {

    event.preventDefault();

    drop.classList.add(
      "active"
    );

  }
);


drop.addEventListener(
  "dragleave",
  () => {

    drop.classList.remove(
      "active"
    );

  }
);


drop.addEventListener(
  "drop",
  event => {

    event.preventDefault();

    drop.classList.remove(
      "active"
    );


    const file =
      event.dataTransfer
      ?.files?.[0];


    selectFile(
      file
    );

  }
);


/* ============================================================
   UPLOAD FIREBASE STORAGE
============================================================ */

function uploadMedia(
  file,
  uid
){

  const storage =
    getStorage();


  const filename =
    uid
    + "-"
    + Date.now()
    + "-"
    + safeName(
      file.name
    );


  const path =
    "vendeur_publications/"
    + uid
    + "/"
    + filename;


  const fileRef =
    storageRef(
      storage,
      path
    );


  const uploadTask =
    uploadBytesResumable(
      fileRef,
      file,
      {

        contentType:
          file.type ||
          "application/octet-stream",


        customMetadata:{

          uploadedBy:
            uid,

          originalName:
            file.name,

          app:
            "DAKPROELITE"

        }

      }
    );


  return new Promise(
    (
      resolve,
      reject
    ) => {


      uploadTask.on(

        "state_changed",


        snapshot => {

          const percent =
            snapshot.totalBytes
            ? (
                snapshot.bytesTransferred /
                snapshot.totalBytes
              ) * 100
            : 0;


          progressBar(
            percent,
            "Envoi vers Firebase Storage..."
          );

        },


        error => {

          reject(
            error
          );

        },


        async () => {

          try{

            const url =
              await getDownloadURL(
                uploadTask.snapshot.ref
              );


            resolve({

              url:

                url,

              path:

                path,

              name:

                filename,

              size:

                file.size,

              mimeType:

                file.type ||
                "application/octet-stream",

              ref:

                uploadTask.snapshot.ref

            });


          }catch(error){

            reject(
              error
            );

          }

        }

      );

    }
  );

}


/* ============================================================
   PUBLICATION FIREBASE
============================================================ */

form.addEventListener(
  "submit",
  async event => {

    event.preventDefault();


    if(publishing){

      return;

    }


    if(!user){

      message(
        "❌ Connectez-vous avant de publier."
      );

      return;

    }


    if(
      !selectedFile ||
      !uploadFile
    ){

      message(
        "❌ Sélectionnez d'abord une photo ou un fichier."
      );

      return;

    }


    publishing =
      true;


    submit.disabled =
      true;


    let uploaded =
      null;


    try{


      /* ======================================================
         RECUPERATION FORMULAIRE
      ====================================================== */

      const type =
        $("type").value;


      const categorie =
        $("categorie")
        .value
        .trim();


      const nom =
        $("nom")
        .value
        .trim();


      const auteur =
        $("auteur")
        .value
        .trim();


      const description =
        $("description")
        .value
        .trim();


      const prixNormal =
        Number(
          $("prixNormal")
          .value
        );


      const promoValue =
        $("prixPromo")
        .value;


      const prixPromo =
        promoValue === ""
        ? null
        : Number(
            promoValue
          );


      const stock =
        Number(
          $("stock")
          .value
        );


      /* ======================================================
         VALIDATION
      ====================================================== */

      if(
        !type ||
        !categorie ||
        !nom ||
        !auteur ||
        !description
      ){

        throw new Error(
          "Veuillez remplir tous les champs obligatoires."
        );

      }


      if(
        !Number.isInteger(
          prixNormal
        ) ||
        prixNormal < 0
      ){

        throw new Error(
          "Prix normal invalide."
        );

      }


      if(
        prixPromo !== null &&
        (
          !Number.isInteger(
            prixPromo
          ) ||
          prixPromo < 0
        )
      ){

        throw new Error(
          "Prix promotionnel invalide."
        );

      }


      if(
        prixPromo !== null &&
        prixNormal > 0 &&
        prixPromo >= prixNormal
      ){

        throw new Error(
          "Le prix promotionnel doit être inférieur au prix normal."
        );

      }


      if(
        !Number.isInteger(
          stock
        ) ||
        stock < 0
      ){

        throw new Error(
          "Stock invalide."
        );

      }


      /* ======================================================
         UPLOAD STORAGE
      ====================================================== */

      progressBar(
        0,
        "Préparation de la publication..."
      );


      uploaded =
        await uploadMedia(
          uploadFile,
          user.uid
        );


      /* ======================================================
         CREATION ID
      ====================================================== */

      const publicationRef =
        push(
          ref(
            database,
            NODE
          )
        );


      const publicationId =
        publicationRef.key;


      if(!publicationId){

        throw new Error(
          "Impossible de générer l'identifiant de publication."
        );

      }


      const now =
        new Date()
        .toISOString();


      /* ======================================================
         OBJET COMPLET
      ====================================================== */

      const publication = {

        /* IDENTIFICATION */

        id:
          publicationId,

        publicationId:
          publicationId,


        /* INFORMATIONS */

        type:
          type,

        categorie:
          categorie,

        nom:
          nom,

        titre:
          nom,

        auteur:
          auteur,


        /* VENDEUR */

        createdBy:
          user.uid,

        sellerId:
          user.uid,

        vendeurId:
          user.uid,


        /* PRIX */

        prixNormal:
          prixNormal,

        prixPromo:
          prixPromo,

        prix:
          prixPromo !== null
          ? prixPromo
          : prixNormal,


        /* STOCK */

        stock:
          stock,


        /* DESCRIPTION */

        description:
          description,


        /* MEDIA */

        imageUrl:
          mediaType === "image"
          ? uploaded.url
          : "",


        mediaUrl:
          uploaded.url,


        url:
          uploaded.url,


        downloadUrl:
          uploaded.url,


        /* STORAGE */

        mediaPath:
          uploaded.path,


        storagePath:
          uploaded.path,


        mediaName:
          selectedFile.name,


        originalFileName:
          selectedFile.name,


        storageFileName:
          uploaded.name,


        /* TYPE MEDIA */

        typeMedia:
          mediaType,


        mediaType:
          mediaType,


        mimeType:
          uploaded.mimeType,


        /* TAILLES */

        fileSize:
          uploaded.size,


        originalFileSize:
          selectedFile.size,


        /* TELECHARGEMENT */

        downloadable:
          mediaType === "image"
          ? false
          : $("downloadable").checked,


        /* STATUT */

        statut:
          "active",


        status:
          "active",


        /* APPLICATION */

        app:
          "DAKPROELITE",


        source:
          "vendeur",


        /* DATES */

        createdAt:
          now,


        updatedAt:
          now

      };


      /* ======================================================
         ENREGISTREMENT DANS REALTIME DATABASE
      ====================================================== */

      await set(
        publicationRef,
        publication
      );


      /* ======================================================
         SUCCES
      ====================================================== */

      progressBar(
        100,
        "Publication enregistrée dans Firebase."
      );


      message(
        "✅ Publication réussie ! Le produit est maintenant enregistré dans DAKPROÉLITE.",
        "success"
      );


      /* ======================================================
         RESET
      ====================================================== */

      form.reset();


      selectedFile =
        null;


      uploadFile =
        null;


      mediaType =
        null;


      $("info").className =
        "info";


      $("preview").className =
        "preview";


      $("download").className =
        "download";


      fileInput.value =
        "";


      /*
      Redirection après confirmation.
      */

      setTimeout(
        () => {

          window.location.href =
            REDIRECT_URL;

        },
        1200
      );


    }catch(error){

      console.error(
        "DAKPROÉLITE Publication:",
        error
      );


      /* ======================================================
         NETTOYAGE STORAGE
         SI LA BASE DE DONNEES ECHOUE
      ====================================================== */

      if(uploaded?.ref){

        try{

          await deleteObject(
            uploaded.ref
          );

        }catch(cleanupError){

          console.error(
            "Erreur nettoyage Storage:",
            cleanupError
          );

        }

      }


      let text =
        error?.message ||
        "Erreur pendant la publication.";


      /* ======================================================
         ERREURS STORAGE
      ====================================================== */

      if(
        error?.code ===
        "storage/unauthorized"
      ){

        text =
          "Firebase Storage refuse l'envoi. Vérifiez vos règles Storage.";

      }


      if(
        error?.code ===
        "storage/quota-exceeded"
      ){

        text =
          "La capacité Firebase Storage est insuffisante.";

      }


      if(
        error?.code ===
        "storage/canceled"
      ){

        text =
          "L'envoi du fichier a été annulé.";

      }


      if(
        error?.code ===
        "storage/unknown"
      ){

        text =
          "Firebase Storage a rencontré une erreur inconnue.";

      }


      /* ======================================================
         ERREURS REALTIME DATABASE
      ====================================================== */

      if(
        error?.code ===
        "database/permission-denied"
      ){

        text =
          "Firebase Realtime Database refuse l'enregistrement. Vérifiez vos règles Database.";

      }


      if(
        error?.code ===
        "database/network-error"
      ){

        text =
          "Erreur réseau pendant l'enregistrement Firebase.";

      }


      message(
        "❌ " + text
      );


      hideProgress();


    }finally{

      publishing =
        false;


      submit.disabled =
        !user;

    }

  }
);

</script>
